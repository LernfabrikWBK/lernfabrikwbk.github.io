<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#009682">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23009682%22/%3E%3C/svg%3E">
<title>Stations-Check Lernfabrik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, schaltschrank-artige Statuskarten, große Daumen-Buttons */
:root{
  --bg:#eef1ee; --panel:#ffffff; --ink:#18201b; --muted:#5d6a61; --line:#d3dad4;
  --accent:#009682; --accent-ink:#ffffff; --accent-soft:#d9efe9;
  --ok:#2f7d32; --ok-soft:#e1f1e0; --warn:#b26a00; --warn-soft:#fbecd3; --bad:#c0392b; --bad-soft:#f8e0dc;
  --ph:#e4e9e5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --panel:#1a211d; --ink:#e7ede8; --muted:#9aa89e; --line:#2c3630;
  --accent:#2bbfa8; --accent-ink:#06201b; --accent-soft:#163a33;
  --ok:#6cc56f; --ok-soft:#1b3320; --warn:#f0a842; --warn-soft:#3a2a10; --bad:#f07b6c; --bad-soft:#3d1d19;
  --ph:#222b26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#1a211d; --ink:#e7ede8; --muted:#9aa89e; --line:#2c3630;
  --accent:#2bbfa8; --accent-ink:#06201b; --accent-soft:#163a33;
  --ok:#6cc56f; --ok-soft:#1b3320; --warn:#f0a842; --warn-soft:#3a2a10; --bad:#f07b6c; --bad-soft:#3d1d19;
  --ph:#222b26; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{font:500 14px var(--f-body);border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
h1,h2{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px}
h2{font-size:20px;letter-spacing:.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
select{font:500 18px var(--f-body);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:600 19px var(--f-body);border-radius:12px;border:2px solid transparent;padding:16px 18px;cursor:pointer;width:100%;text-align:center;min-height:58px}
.btn:focus-visible,.tabs button:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.yes{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.opt{background:var(--panel);color:var(--ink);border-color:var(--line);text-align:left}
.btn.done{background:var(--accent);color:var(--accent-ink)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers.list{grid-template-columns:1fr}
.link{background:none;border:0;color:var(--muted);font:500 15px var(--f-body);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sections{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sections span{height:6px;border-radius:3px;background:var(--line)}
.sections span.on{background:var(--accent)}
.sections span.done{background:var(--accent);opacity:.45}
.photos{display:grid;gap:10px;grid-template-columns:1fr}
.photos.n2{grid-template-columns:1fr 1fr}
.photos.n3{grid-template-columns:1fr 1fr}
.photos.n3 .ph:first-child{grid-column:1/-1}
.ph{margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
.ph .zoom{padding:0;border:0;background:var(--ph);border-radius:10px;overflow:hidden;cursor:zoom-in;display:block;width:100%;aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph figcaption{font-size:13px;line-height:1.3;color:var(--muted)}
.photos.n1 .ph figcaption{font-size:14px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
#lb img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:8px}
#lb p{color:#eef1ee;margin:0;text-align:center;font-size:16px}
#lb span{color:#9aa89e;font-size:13px}
.q{font-size:22px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.hint{color:var(--muted);margin:0;font-size:16px}
.kind{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;align-self:flex-start}
.kind.q{background:var(--accent-soft);color:var(--ink)}
.kind.a{background:var(--warn-soft);color:var(--warn)}
.kind.n{background:var(--bad-soft);color:var(--bad)}
.result{border-width:2px}
.result.ok{border-color:var(--ok);background:var(--ok-soft)}
.result.tech{border-color:var(--bad);background:var(--bad-soft)}
.result.dorian{border-color:var(--warn);background:var(--warn-soft)}
.result h1{font-size:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.save{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.jump{margin:0;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:15px}
.picked{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent)}
.picked b{font-family:var(--f-display);font-size:30px;line-height:1.1}
.picked .link{padding-top:4px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:st}
.log li{display:grid;grid-template-columns:2em 1fr auto;gap:4px 10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);counter-increment:st;font-size:15px}
.log li::before{content:counter(st);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.log li .t{min-width:0}
.log li.a .t{color:var(--muted)}
.ans{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);white-space:nowrap;justify-self:end;max-width:11em;overflow:hidden;text-overflow:ellipsis}
.ans.ja{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.ans.nein{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0;min-width:0}
details.proto summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.proto summary::after{content:"anzeigen";font:500 13px var(--f-body);color:var(--muted);text-decoration:underline}
details.proto[open] summary::after{content:"ausblenden"}
details.proto[open] summary{margin-bottom:10px}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line);min-height:48px;font-size:16px;padding:12px}
.copied{font-family:var(--f-mono);font-size:12px;color:var(--ok)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .n{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .l{font-size:14px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.bar .t{min-width:0}
.bar .c{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar.bad .fill{background:var(--bad)} .bar.warn .fill{background:var(--warn)} .bar.ok .fill{background:var(--ok)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
.note{font-size:14px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.step{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="lamp" aria-hidden="true"></span><b>Stations-Check</b></div>
    <nav class="tabs" aria-label="Ansicht">
      <button id="tab-check" aria-pressed="true">Prüfen</button>
      <button id="tab-stats" aria-pressed="false">Auswertung</button>
    </nav>
  </header>
  <main id="view"></main>
  <div id="lb" hidden role="dialog" aria-label="Foto"><img alt=""><p></p><span>Tippen zum Schließen</span></div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/* ---------- Ablauf: jeder Knoten = ein Bildschirm ----------
   type q = Frage, a = Handlung (Button "Erledigt"), n = Hinweis (Button "Weiter"), end = Ergebnis
   img     = Bildnummer aus der Anleitung (wird später durch echtes Foto ersetzt)
   AUSWERTUNG – gezählt wird nur, was sicher ist:
   obsYes/obsNo/o.obs = Befund, den die Person direkt gesehen hat (z. B. "NUC-PC war aus")
   fix     = Handlung, die nur zählt, wenn die nächste Kontrollfrage danach positiv ausfällt
   confirm = Kontrollfrage: "Ja" bestätigt die offenen fix-Handlungen, "Nein" verwirft sie
   clearOnNo = Zwischenkontrolle: "Nein" verwirft die offenen fix-Handlungen, "Ja" bestätigt noch nichts
   reason  = bei Eskalation: was ungelöst blieb
   noIfVisited = [Knoten, Ziel]: "Nein" führt zum Ziel, wenn Knoten in diesem Durchlauf schon besucht wurde (z. B. Strom schon geprüft)
   noAgain = wird die Frage im selben Durchlauf ein ZWEITES Mal mit "Nein" beantwortet, geht es hierhin (verhindert Endlosschleifen) */
const SECTIONS=["Beleuchtung","Stromversorgung","Monitor & PC","Docker & MES"];
const FLOW={
 LP:{imgs:[{f: "led-panel-vorne-an", c: "Vorderes Panel an"}, {f: "led-panel-oben-an", c: "Oberes Panel an"}, {f: "station-aus", c: "Beide Panels aus"}],s:0,type:"q",text:"Welche LED-Panels leuchten?",hint:"Schau auf das vordere und das obere Panel der Station.",opts:[
   {l:"Beide",to:"FC",k:"yes"},
   {l:"Nur vorne, oben aus",to:"TM1",obs:"Oberes LED-Panel aus"},
   {l:"Nur oben, vorne aus",to:"FB"},
   {l:"Keins",to:"E",k:"no"}]},

 TM1:{s:0,type:"n",text:"Bitte einen Techniker informieren.",hint:"Das obere Panel ist aus. Die Station funktioniert trotzdem, nur ohne Beleuchtung. Du kannst weiter prüfen.",to:"C",tech:true},

 E1:{imgs:[{f:"notaus-geloest",c:"So soll er danach aussehen"}],s:1,type:"a",text:"Notaus durch Ziehen nach oben lösen.",to:"F"},

 H:{imgs:[{f:"station-eingeschaltet",c:"Kontroll-LED leuchtet grün"}],s:1,type:"q",text:"Leuchtet die Kontroll-LED?",yes:"BM",no:"NK0",confirm:true,fallback:"Station war nur ausgeschaltet (grüner Knopf)",fallbackIf:["LP","Keins"],fallbackUnless:["Notaus war gedrückt","Hauptschalter war aus"]},
 NK0:{imgs:[{f:"kein-stecker-station",c:"Hier gehört das Netzkabel hin"},{f:"stecker-station",c:"Kabel hinten in der Station"},{f:"stecker-steckdose",c:"Anderes Ende in der Steckdose"}],s:1,type:"q",text:"Steckt das Netzkabel hinten an der Station und in der Steckdose?",yes:"TM3",no:"K0"},

 PT:{s:1,type:"q",text:"Kam nach dem Einstecken ein sich wiederholender Piepton?",hint:"Nur fürs Protokoll, beide Antworten sind in Ordnung.",yes:"NA",no:"NA"},
 NA:{imgs:[{f:"station-laedt",c:"Netzbetrieb: Smiley, 2 Pfeile bewegen sich"},{f:"batterie-modus",c:"Batteriebetrieb: nur 1 Pfeil"}],s:1,type:"q",text:"Anzeige hinter der vorderen Tür: Bewegen sich 2 Pfeile (links → Mitte und Mitte → rechts)?",yes:"C",no:"TM4",confirm:true},

 BL:{s:1,type:"n",text:"Die Batterie ist zu schwach.",hint:"Die Station muss jetzt am Netz laufen und laden. Im nächsten Schritt schließt du das Netzkabel an.",to:"K"},

 C2:{imgs:[{f:"monitor-an",c:"LED leuchtet"}],s:2,type:"q",text:"Leuchtet die Monitor-LED jetzt?",yes:"P",no:"E",noIfVisited:["E","MK"],confirm:true,
   noHint:"Dann prüfen wir jetzt die Stromversorgung der Station."},
 MK:{s:2,type:"q",text:"Steckt das Stromkabel hinten am Monitor fest?",yes:"TM5",no:"MK1"},
 MK1:{s:2,type:"a",text:"Stromkabel hinten am Monitor fest einstecken.",to:"C3",fix:"Monitor-Stromkabel war lose"},
 C3:{imgs:[{f:"monitor-an",c:"LED leuchtet"}],s:2,type:"q",text:"Leuchtet die Monitor-LED jetzt?",hint:"Falls nicht: Power-Schalter am Monitor noch einmal drücken.",yes:"P",no:"TM5",confirm:true},
 P:{imgs:[{f:"anmelden-kennwort",c:"Normal: z. B. der Sperr- oder Anmeldebildschirm"}],s:2,type:"q",text:"Zeigt der Monitor ein normales Bild?",yes:"TO",no:"N"},
 N:{imgs:[{f:"nuc-aus",c:"NUC aus: Knopf dunkel"},{f:"nuc-an",c:"NUC an: Knopf leuchtet blau"}],s:2,type:"q",text:"Ist der NUC-PC an?",yes:"HD",no:"N1",noAgain:"NC",obsNo:"NUC-PC war aus"},

/* Befunde aus dem gegangenen Weg ableiten */
function computeFindings(hist){
  const found=[];let pending=[];
  for(const h of hist){const n=FLOW[h.id];
    if(h.obs) found.push(h.obs);
    if(n.type==="a"&&n.fix) pending.push(n.fix);
    if(n.confirm&&h.pos===true){
      if(pending.length) found.push(...pending);
      else if(n.fallback&&!(n.fallbackUnless||[]).some(x=>found.includes(x))&&(!n.fallbackIf||hist.some(x=>x.id===n.fallbackIf[0]&&x.answer===n.fallbackIf[1]))) found.push(n.fallback);
      pending=[];
    } else if((n.confirm||n.clearOnNo)&&h.pos===false){pending=[];}
  }
  return [...new Set(found)];
}

/* Fotos: Datei in den Ordner images/ legen, Name = Platzhalter-Text klein, ohne Umlaute.
   "Bild 7" -> images/bild-7.jpg  ·  "Bild WBK-Grün" -> images/bild-wbk-gruen.jpg */
function imgFile(f){return "images/"+f+".jpg"}

/* ---------- Speicher: geteilte Datenbank, sonst nur dieses Gerät ---------- */
const LS="stationscheck.runs", LS_ST="stationscheck.station";
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let sb=null;
try{ if(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY&&window.supabase) sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:false}}); }catch(e){sb=null}
const LS_Q="stationscheck.queue";
function toRow(r){return {station:r.station,ts:r.ts,end_node:r.end,kind:r.kind,tech_note:r.techNote,findings:r.findings,unresolved:r.unresolved,path:r.path,duration_sec:r.durationSec}}
function fromRow(x){return {station:x.station,ts:Number(x.ts),end:x.end_node,kind:x.kind,techNote:x.tech_note,findings:x.findings||[],unresolved:x.unresolved,path:x.path||[],durationSec:x.duration_sec}}
async function insert(rows){const {error}=await sb.from("runs").insert(rows.map(toRow));if(error)throw error}
/* Ergebnisse, die offline nicht gespeichert werden konnten, später nachreichen */
async function flushQueue(){ if(!sb) return; const q=lsGet(LS_Q,[]); if(!q.length) return;
  try{await insert(q);lsSet(LS_Q,[])}catch(e){} }
async function saveRun(run){
  const all=lsGet(LS,[]);all.push(run);lsSet(LS,all.slice(-1000));
  if(!sb) return "local";
  try{await insert([run]);flushQueue();return "shared"}
  catch(e){const q=lsGet(LS_Q,[]);q.push(run);lsSet(LS_Q,q.slice(-500));return "queued"}
}
async function loadRuns(){
  if(sb){try{const {data,error}=await sb.from("runs").select("*").order("ts",{ascending:false}).limit(2000);
    if(error)throw error;return {runs:data.map(fromRow),src:"shared"}}catch(e){}}
  return {runs:lsGet(LS,[]).slice().reverse(),src:"local"};
}

function sectionBar(s){return `<div class="sections" aria-label="Abschnitt ${s+1} von 4">${SECTIONS.map((_,i)=>`<span class="${i<s?"done":i===s?"on":""}"></span>`).join("")}</div>`}

function render(){
  if(state.view!=="check")return;
  if(!state.node){renderStart();return;}
  const n=FLOW[state.node];
  if(n.type==="end"){renderEnd(n);return;}
  const kindTag=n.type==="q"?`<span class="kind q">Frage</span>`:n.type==="a"?`<span class="kind a">Handlung</span>`:`<span class="kind n">Hinweis</span>`;
  let btns="";
  if(n.type==="q"&&n.opts){btns=`<div class="answers list">${n.opts.map((o,i)=>`<button class="btn ${o.k||"opt"}" data-opt="${i}">${esc(o.l)}</button>`).join("")}</div>`}
  else if(n.type==="q"){btns=`<div class="answers"><button class="btn yes" data-yn="yes">Ja</button><button class="btn no" data-yn="no">Nein</button></div>`}
  else{btns=`<button class="btn done" data-next="1">${n.type==="a"?"Erledigt":"Verstanden, weiter"}</button>`}
  const last=state.history[state.history.length-1], lf=last&&FLOW[last.id];
  const jump=lf&&lf.noHint&&last.answer==="Nein"&&state.node===lf.no?`<p class="jump">${esc(lf.noHint)}</p>`:"";
  $view.innerHTML=`${jump}<section class="card step">
    <div class="row"><span class="eyebrow">${state.station} · ${n.s+1}/4 ${SECTIONS[n.s]}</span>${kindTag}</div>
    ${sectionBar(n.s)}
    ${photo(n)}
    <p class="q">${esc(n.text)}</p>
    ${n.hint?`<p class="hint">${esc(n.hint)}</p>`:""}
    ${btns}
    <div class="row"><button class="link" id="back">${state.history.length?"Zurück":"Abbrechen"}</button><span class="save">Schritt ${state.history.length+1}</span></div>
  </section>`;
  $view.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const o=n.opts[+b.dataset.opt];go(o.to,o.l,{obs:o.obs})});
  $view.querySelectorAll("[data-yn]").forEach(b=>b.onclick=()=>{const y=b.dataset.yn==="yes";const again=state.history.some(h=>h.id===state.node);
    const visited=n.noIfVisited&&state.history.some(h=>h.id===n.noIfVisited[0]);
    go(y?n.yes:(n.noAgain&&again?n.noAgain:visited?n.noIfVisited[1]:n.no),y?"Ja":"Nein",{obs:y?n.obsYes:n.obsNo,pos:y})});
  $view.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>go(n.to,n.type==="a"?"Erledigt":"Weiter",{tech:n.tech}));
  document.getElementById("back").onclick=back;
}

function go(to,answer,x){
  state.history.push({id:state.node,answer,obs:x.obs||null,pos:x.pos===undefined?null:x.pos,tech:!!x.tech});
  state.node=to; render(); if(FLOW[to].type==="end") finish(); window.scrollTo(0,0);
}
function back(){
  if(!state.history.length){state.node=null;render();return;}
  const h=state.history.pop();state.node=h.id;render();
}

/* ---------- Prüfprotokoll: was wurde in welcher Reihenfolge gemacht ---------- */
function protoSteps(path){ /* path: ["LP:Beide","FC:Ja",...] */
  return path.map(p=>{const i=p.indexOf(":");const id=p.slice(0,i),ans=p.slice(i+1);const n=FLOW[id];if(!n)return null;
    if(n.type==="q") return {kind:"q",text:n.text,ans};
    if(n.type==="a") return {kind:"a",text:n.text,ans:"erledigt"};
    return {kind:"n",text:n.text,ans:"gelesen"};}).filter(Boolean);
}
const fmtFull=t=>new Date(t).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtDur=s=>s==null?"–":s<60?s+" s":Math.round(s/60)+" min";
function protoHTML(run){
  const steps=protoSteps(run.path||[]);
  const n=FLOW[run.end]||{};
  return `<dl class="meta">
      <dt>Station</dt><dd>${esc(run.station)}</dd>
      <dt>Zeitpunkt</dt><dd>${esc(fmtFull(run.ts))}</dd>
      <dt>Dauer</dt><dd>${fmtDur(run.durationSec)}</dd>
      <dt>Ergebnis</dt><dd>${esc(n.title||run.end)}${run.unresolved?": "+esc(run.unresolved):""}</dd>
      ${(run.findings||[]).length?`<dt>Ursachen</dt><dd>${esc(run.findings.join(", "))}</dd>`:""}
    </dl>
    <ol class="log">${steps.map(x=>`<li class="${x.kind}"><span class="t">${esc(x.text)}</span><span class="ans ${x.ans==="Ja"?"ja":x.ans==="Nein"?"nein":""}">${esc(x.ans)}</span></li>`).join("")}</ol>`;
}
function protoText(run){
  const n=FLOW[run.end]||{};
  const lines=[`Stations-Check – ${run.station}`,`${fmtFull(run.ts)} · Dauer ${fmtDur(run.durationSec)}`,
    `Ergebnis: ${n.title||run.end}${run.unresolved?" – "+run.unresolved:""}`];
  if((run.findings||[]).length) lines.push(`Ursachen: ${run.findings.join(", ")}`);
  lines.push("","Bereits durchgeführt:");
  protoSteps(run.path||[]).forEach((x,i)=>lines.push(`${i+1}. ${x.text} → ${x.ans}`));
  return lines.join("\n");
}
async function copyText(txt,btn){
  try{await navigator.clipboard.writeText(txt);btn.textContent="Kopiert";setTimeout(()=>btn.textContent="Protokoll kopieren",2000)}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="absolute";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");btn.textContent="Kopiert"}catch(_){btn.textContent="Kopieren nicht möglich"}ta.remove();setTimeout(()=>btn.textContent="Protokoll kopieren",2000)}
}

async function finish(){
  const n=FLOW[state.node];
  const findings=computeFindings(state.history);
  const run={station:state.station,ts:Date.now(),end:state.node,kind:n.kind,
    techNote:state.history.some(h=>h.tech),findings,unresolved:n.reason||null,
    path:state.history.map(h=>h.id+":"+h.answer),durationSec:Math.round((Date.now()-state.started)/1000)};
  state.lastRun=run; state.saved="saving"; renderEnd(n);
  state.saved=await saveRun(run); if(state.view==="check"&&FLOW[state.node]===n) renderEnd(n);
}

  const fromQR=!!urlStation&&!state.pickStation;
  $view.innerHTML=`<section class="card">
    <span class="eyebrow">Lernfabrik · Funktionsprüfung</span>
    <h1>Läuft die Station?</h1>

    ${fromQR?`<div class="picked"><span class="eyebrow">Du prüfst</span><b>${esc(state.station)}</b>
        <button class="link" id="change">Andere Station wählen</button></div>`
      :`${photo({imgs:[{f:"stationsname",c:"Der Name steht auf dem Schild über der Station"}]})}
        <label class="f" for="st">Welche Station prüfst du?
        <select id="st">${STATIONS.map(s=>`<option ${s===state.station?"selected":""}>${esc(s)}</option>`).join("")}</select></label>`}
    <button class="btn primary" id="go">Prüfung starten</button>
  </section>
  <p class="note">Jede abgeschlossene Prüfung wird gespeichert, damit wir sehen, wo die Fehler am häufigsten liegen.</p>`;
  const sel=document.getElementById("st");
  if(sel) sel.onchange=e=>{state.station=e.target.value;lsSet(LS_ST,state.station)};
  const ch=document.getElementById("change");
  if(ch) ch.onclick=()=>{state.pickStation=true;renderStart();document.getElementById("st").focus()};
  document.getElementById("go").onclick=()=>{if(sel){state.station=sel.value;lsSet(LS_ST,state.station)}
    state.node=START;state.history=[];state.started=Date.now();state.saved=null;render();};
}

function renderEnd(n){
  const findings=computeFindings(state.history);
  const tech=state.history.some(h=>h.tech);
  const run=state.lastRun&&state.lastRun.end===state.node?state.lastRun:{station:state.station,ts:Date.now(),end:state.node,findings,unresolved:n.reason||null,path:state.history.map(h=>h.id+":"+h.answer),durationSec:Math.round((Date.now()-state.started)/1000)};
  const help=n.kind!=="ok";
  const savedTxt=state.saved==="saving"?"Wird gespeichert …":state.saved==="shared"?"Ergebnis gespeichert":state.saved==="local"?"Ergebnis nur auf diesem Gerät gespeichert":state.saved==="queued"?"Kein Netz: Ergebnis wird beim nächsten Öffnen nachgereicht":"";
  $view.innerHTML=`<section class="card result ${n.kind}">
    <span class="eyebrow">${esc(state.station)} · Ergebnis</span>
    <h1>${esc(n.title)}</h1>
    <p class="hint" style="color:var(--ink)">${esc(n.text)}</p>
    ${photo(n)}
    ${help?`<p class="hint" style="color:var(--ink)">Zeig ${n.kind==="dorian"?"Dorian":"dem Techniker"} das Prüfprotokoll unten oder schick es ihm. Dann muss niemand die Schritte wiederholen.</p>`:""}
    ${tech&&n.kind==="ok"?`<p class="hint" style="color:var(--ink)"><b>Offen:</b> Bitte trotzdem einen Techniker wegen der Beleuchtung informieren.</p>`:""}
    ${findings.length?`<div><span class="eyebrow">Gefundene Ursachen</span><div class="chips" style="margin-top:6px">${findings.map(f=>`<span class="chip">${esc(f)}</span>`).join("")}</div></div>`:""}
    <span class="save">${savedTxt}</span>
  </section>
  <section class="card">
    <details class="proto" ${help?"open":""}><summary><h2>Prüfprotokoll</h2></summary>${protoHTML(run)}</details>
    <button class="btn ghost" id="copy">Protokoll kopieren</button>
  </section>
  <button class="btn primary" id="again">Neue Prüfung</button>
  <button class="link" id="back">Letzte Antwort ändern</button>`;
  document.getElementById("copy").onclick=e=>copyText(protoText(run),e.currentTarget);
  document.getElementById("again").onclick=()=>{state.node=null;state.history=[];state.lastRun=null;render()};
  document.getElementById("back").onclick=()=>{state.lastRun=null;back()};
}

/* ---------- Auswertung ---------- */
function count(arr){const m=new Map();arr.forEach(x=>m.set(x,(m.get(x)||0)+1));return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function bars(entries,total,cls){ if(!entries.length) return `<p class="empty">Noch keine Daten</p>`;
  return `<div class="bars">${entries.map(([k,v])=>`<div class="bar ${cls?cls(k):""}"><span class="t">${esc(k)}</span><span class="c">${v} · ${Math.round(v/total*100)}%</span><div class="track"><div class="fill" style="width:${Math.max(3,v/total*100)}%"></div></div></div>`).join("")}</div>`}

async function renderStats(){
  $view.innerHTML=`<section class="card"><p class="empty">Lade Auswertung …</p></section>`;
  const {runs,src}=await loadRuns();
  if(state.view!=="stats")return;
  const total=runs.length;
  const by=k=>runs.filter(r=>r.kind===k).length;
  const pct=x=>total?Math.round(x/total*100)+"%":"–";
  const findings=count(runs.flatMap(r=>r.findings||[]));
  const unresolved=count(runs.map(r=>r.unresolved||FLOW[r.end]?.reason).filter(Boolean));
  const outcomes=count(runs.map(r=>r.kind!=="ok"?KIND_LABEL[r.kind]+" gerufen":!(r.findings||[]).length?"Alles war schon in Ordnung":r.techNote?"Selbst behoben, Beleuchtung offen":"Selbst behoben"));
  const stations=STATIONS.map(s=>{const rs=runs.filter(r=>r.station===s);const top=count(rs.flatMap(r=>r.findings||[]))[0];
    return {s,n:rs.length,bad:rs.filter(r=>r.kind!=="ok").length,top:top?top[0]:"–"}}).filter(x=>x.n);
  const fmt=t=>new Date(t).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const col={ok:"var(--ok)",tech:"var(--bad)",dorian:"var(--warn)"};
  $view.innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="n">${total}</div><div class="l">Prüfungen gesamt</div></div>
    <div class="kpi"><div class="n">${pct(by("ok"))}</div><div class="l">Ohne Hilfe gelöst</div></div>
    <div class="kpi"><div class="n">${by("tech")}</div><div class="l">Techniker gerufen</div></div>
    <div class="kpi"><div class="n">${by("dorian")}</div><div class="l">An Dorian gemeldet</div></div>
  </div>
  <section class="card"><h2>Häufigste Ursachen</h2>${bars(findings,total)}
    <p class="note">Gezählt wird nur, was jemand direkt gesehen hat oder was nachweislich geholfen hat. Prozent = Anteil aller Prüfungen.</p></section>
  <section class="card"><h2>Ungelöst, Hilfe geholt</h2>${bars(unresolved,total,k=>k.startsWith("Docker")||k.startsWith("RFID")?"warn":"bad")}</section>
  <section class="card"><h2>Wie endeten die Prüfungen?</h2>${bars(outcomes,total,k=>k.startsWith("Alles")||k.startsWith("Selbst")?"ok":k.startsWith("Dorian")?"warn":"bad")}</section>
  <section class="card"><h2>Nach Station</h2>${stations.length?`<div class="tablewrap"><table><thead><tr><th>Station</th><th>Prüf.</th><th>Mit Hilfe</th><th>Häufigste Ursache</th></tr></thead><tbody>${stations.map(x=>`<tr><td>${x.s}</td><td class="num">${x.n}</td><td class="num">${x.bad}</td><td>${esc(x.top)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">Noch keine Daten</p>`}</section>
  <section class="card"><h2>Letzte Prüfungen</h2>${runs.length?`<div class="bars">${runs.slice(0,20).map(r=>`<details class="proto"><summary><span><span class="dot" style="background:${col[r.kind]}"></span>${esc(fmt(r.ts))} · ${esc(r.station)} · ${KIND_LABEL[r.kind]}${r.unresolved?` · ${esc(r.unresolved)}`:""}</span></summary>${protoHTML(r)}</details>`).join("")}</div>`:`<p class="empty">Sobald jemand eine Prüfung abschließt, erscheint sie hier.</p>`}
    <p class="note">Antippen zeigt das Prüfprotokoll mit allen Schritten.</p></section>
  <p class="note">${src==="shared"?"Daten aus allen gespeicherten Prüfungen.":sb?"Supabase gerade nicht erreichbar. Angezeigt werden nur Prüfungen von diesem Gerät.":"Noch keine Datenbank eingerichtet (config.js). Angezeigt werden nur Prüfungen von diesem Gerät."}</p>`;
}

if(state.view==="stats") setTab("stats"); else render();
</script>
