<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-Codes Stations-Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap">
<style>
  :root{--ink:#18201b;--muted:#5d6a61;--line:#d3dad4;--accent:#009682}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:"Barlow",system-ui,sans-serif;padding:24px 16px}
  .bar{max-width:900px;margin:0 auto 24px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:28px;margin:0}
  button{font:600 16px "Barlow",sans-serif;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
  .grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .label{border:2px solid var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;break-inside:avoid;page-break-inside:avoid}
  .label h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;margin:0}
  .label p{margin:0;font-size:15px;color:var(--muted)}
  .label .qr{width:200px;height:200px}
  .label .qr svg{width:200px;height:200px;display:block}
  .url{font-size:11px;color:var(--muted);word-break:break-all}
  .note{max-width:900px;margin:0 auto 16px;color:var(--muted)}
  @media print{.bar button,.note{display:none}body{padding:0}.grid{gap:10mm}}
</style>
</head>
<body>
  <div class="bar">
    <h1>QR-Codes für die Stationen</h1>
    <button onclick="window.print()">Drucken</button>
  </div>
  <p class="note">Jeder Code öffnet den Stations-Check mit der passenden Station schon ausgewählt. Die Namen kommen aus config.js.</p>
  <div class="grid" id="grid"></div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
  const stations=(window.CONFIG&&window.CONFIG.STATIONS)||["Station 1"];
  const base=location.href.replace(/qr\.html.*$/,"");
  const grid=document.getElementById("grid");
  const all=[...stations.map(n=>({name:n})),{name:"MES vorbereiten",mes:true}];
  all.forEach(({name,mes},i)=>{
    const slug=name.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const url=mes?base+"?m=mes":base+"?s="+slug;
    const el=document.createElement("div");el.className="label";
    el.innerHTML=`<h2></h2><div class="qr"></div><p>${mes?"Schulung, Demo oder Rollen einrichten.<br>Für wenn die Stationen schon laufen.":"Station funktioniert nicht?<br>Code scannen, Schritt für Schritt prüfen."}</p><div class="url"></div>`;
    el.querySelector("h2").textContent=name;
    el.querySelector(".url").textContent=url;
    grid.appendChild(el);
    const qr=qrcode(0,"M");qr.addData(url);qr.make();
    el.querySelector(".qr").innerHTML=qr.createSvgTag({scalable:true,margin:2});
  });
</script>
</body>
</html>
